spring:
  application:
    name: hootoom-forum-api
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
    test-connection: false
  profiles:
    active: ${APP_ENV:local}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:hootoom_forum}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=${DB_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    hikari:
      pool-name: HootoomForumPool
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000
      validation-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.hootoom.forum.**.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.hootoom.forum: ${LOG_LEVEL_APP:INFO}
    org.mybatis: WARN
  config: classpath:logback-spring.xml

app:
  profile:
    allowed-avatar-keys: ${PROFILE_ALLOWED_AVATAR_KEYS:default-1,default-2,default-3,default-4,default-5,default-6,default-7,default-8}
  auth:
    verification-token-minutes: ${AUTH_VERIFICATION_TOKEN_MINUTES:30}
    password-reset-token-minutes: ${AUTH_PASSWORD_RESET_TOKEN_MINUTES:15}
    registration-limit-per-hour: ${AUTH_REGISTRATION_LIMIT_PER_HOUR:5}
    current-policy-version: ${CURRENT_POLICY_VERSION:2026-10-07}
    access-token-minutes: ${AUTH_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${AUTH_REFRESH_TOKEN_DAYS:7}
    issuer: ${AUTH_TOKEN_ISSUER:hootoom-forum-api}
    audience: ${AUTH_TOKEN_AUDIENCE:hootoom-forum-web}
    key-id: ${AUTH_TOKEN_KEY_ID:local-dev-key}
    private-key: ${AUTH_TOKEN_PRIVATE_KEY:}
    public-key: ${AUTH_TOKEN_PUBLIC_KEY:}
    cookie-secure: ${AUTH_COOKIE_SECURE:false}
    trusted-origins: ${AUTH_TRUSTED_ORIGINS:http://localhost:3000,http://localhost:8080}
  mail:
    # 32 字节 AES 密钥的 Base64；仅在产生邮件任务时读取，禁止提交真实值。
    outbox-encryption-key: ${MAIL_OUTBOX_ENCRYPTION_KEY:}
    verification-base-url: ${MAIL_VERIFICATION_BASE_URL:http://localhost:3000/verify-email}
    password-reset-base-url: ${MAIL_PASSWORD_RESET_BASE_URL:http://localhost:3000/reset-password}
    from: ${MAIL_FROM:}
    outbox-batch-size: ${MAIL_OUTBOX_BATCH_SIZE:20}
    outbox-max-retries: ${MAIL_OUTBOX_MAX_RETRIES:5}
    outbox-poll-delay-ms: ${MAIL_OUTBOX_POLL_DELAY_MS:5000}
    outbox-lock-timeout-minutes: ${MAIL_OUTBOX_LOCK_TIMEOUT_MINUTES:10}

