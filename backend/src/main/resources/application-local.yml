spring:
  config:
    # 本机密码和密钥放在被 Git 忽略的文件中；CI/部署环境改用环境变量。
    import: optional:classpath:application-local-secret.yml
  flyway:
    # 本地数据库若已手工执行V1，首次启动时在非空schema建立version=1基线，避免重复建表。
    # 全新空库仍会正常执行V1。共享环境不得开启该选项。
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:true}

logging:
  level:
    com.hootoom.forum: DEBUG

management:
  health:
    # 本地未启动 Mailpit 时不应把 API 整体标记为 DOWN；邮件投递失败仍由发件箱日志记录并重试。
    mail:
      enabled: false
